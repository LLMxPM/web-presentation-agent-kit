[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-presentation-api-client"
version = "0.1.0"
description = "web-presentation External API v1 的共享 Python 客户端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/LLMxPM/web-presentation-agent-kit"
Repository = "https://github.com/LLMxPM/web-presentation-agent-kit"
Issues = "https://github.com/LLMxPM/web-presentation-agent-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wp_api_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
